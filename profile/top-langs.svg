<svg
  xmlns="http://www.w3.org/2000/svg"
  width="360"
  height="190"
  viewBox="0 0 360 190"
  role="img"
  aria-labelledby="languages-title languages-desc"
>
  <title id="languages-title">LuciusChen's top languages</title>
  <desc id="languages-desc">Languages used across public, owned, non-fork repositories.</desc>
  <style>
    .title { font: 600 18px "Segoe UI", Ubuntu, sans-serif; fill: #70a5fd; }
    .language { font: 600 12px "Segoe UI", Ubuntu, sans-serif; fill: #a9b1d6; }
    .percentage { font: 400 11px "Segoe UI", Ubuntu, sans-serif; fill: #787c99; }
    .updated { font: 400 11px "Segoe UI", Ubuntu, sans-serif; fill: #565f89; }
  </style>
  <rect x="0.5" y="0.5" width="359" height="189" rx="6" fill="#1a1b27" stroke="#30363d"/>
  <text x="26" y="36" class="title">Most Used Languages</text>
  <defs>
    <clipPath id="language-bar">
      <rect x="26" y="58" width="308" height="8" rx="4"/>
    </clipPath>
  </defs>
  <g clip-path="url(#language-bar)">
    <rect x="26" y="58" width="308" height="8" fill="#30363d"/>
    <rect x="26.00" y="58" width="138.73" height="8" fill="#c065db"/><rect x="164.73" y="58" width="62.27" height="8" fill="#e34c26"/><rect x="227.00" y="58" width="34.35" height="8" fill="#dea584"/><rect x="261.35" y="58" width="21.17" height="8" fill="#555555"/><rect x="282.52" y="58" width="16.09" height="8" fill="#3178c6"/><rect x="298.62" y="58" width="15.84" height="8" fill="#3572A5"/>
  </g>
  <g>
      <circle cx="28" cy="94" r="5" fill="#c065db"/>
      <text x="40" y="99" class="language">Emacs Lisp</text>
      <text x="174" y="99" text-anchor="end" class="percentage">45.0%</text>
    </g>
  <g>
      <circle cx="190" cy="94" r="5" fill="#e34c26"/>
      <text x="202" y="99" class="language">HTML</text>
      <text x="336" y="99" text-anchor="end" class="percentage">20.2%</text>
    </g>
  <g>
      <circle cx="28" cy="124" r="5" fill="#dea584"/>
      <text x="40" y="129" class="language">Rust</text>
      <text x="174" y="129" text-anchor="end" class="percentage">11.2%</text>
    </g>
  <g>
      <circle cx="190" cy="124" r="5" fill="#555555"/>
      <text x="202" y="129" class="language">C</text>
      <text x="336" y="129" text-anchor="end" class="percentage">6.9%</text>
    </g>
  <g>
      <circle cx="28" cy="154" r="5" fill="#3178c6"/>
      <text x="40" y="159" class="language">TypeScript</text>
      <text x="174" y="159" text-anchor="end" class="percentage">5.2%</text>
    </g>
  <g>
      <circle cx="190" cy="154" r="5" fill="#3572A5"/>
      <text x="202" y="159" class="language">Python</text>
      <text x="336" y="159" text-anchor="end" class="percentage">5.1%</text>
    </g>
  <text x="334" y="178" text-anchor="end" class="updated">Updated 2026-08-12 UTC</text>
</svg>
