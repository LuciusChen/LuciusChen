name: Update profile cards

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate profile cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-profile-cards.mjs

      - name: Validate generated cards
        run: |
          grep -q "<svg" profile/top-langs.svg
          grep -q "<svg" profile/stats.svg
          if grep -Eqi "Something went wrong|Resource not accessible|rate limit" profile/*.svg; then
            exit 1
          fi

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile cards"
          git push
